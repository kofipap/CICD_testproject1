name: CICD

on:
  push:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        run: |
          echo "${{ secrets.DOCKER__PASSWORD }}" | docker login -u "${{ secrets.DOCKER__USERNAME }}" --password-stdin

      - name: Build Docker image
        run: docker build -t papsCICDP3/nodejs-app:latest .

      - name: Push image to Docker Hub
        run: docker push papsCICDP3/nodejs-app:latest

  deploy:
    needs: build
    runs-on: self-hosted

    steps:
      - name: Pull image from Docker Hub
        run: docker pull papsCICDP3/nodejs-app:latest

      - name: Stop old container (ignore errors)
        run: docker rm -f nodejs-app-container || true

      - name: Run new container
        run: docker run -d -p 3000:3000 --name nodejs-app-container papsCICDP3/nodejs-app:latest