name: CICD

on: 
  push:
    branches: [master]

jobs:
  build:
     runs-on: [ubuntu-latest]
     steps:
        - name: Checkout source
          uses: actions/checkout@v6

        - name: Login to Docker hub
          run:  echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

        - name: Build docker image
          run: docker build -t papsCICDP3/nodejs-app:latest .

        - name: Publish image to docker hub
          run: docker push papsCICDP3/nodejs-app:latest
  deploy:
     needs: build
     runs-on: [aws-ec2] 
     steps:
       - name: Pull image from docker hub
         run: docker pull papsCICDP3/nodejs-app:latest

       - name: Delete old container
         run: docker rm -f nodejs-app-container

       - name: Run docker container
         run: docker run -d -p 3000:3000 --name nodejs-app-container papsCICDP3/nodejs-app
       