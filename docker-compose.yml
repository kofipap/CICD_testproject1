version: "3.9"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nodejs-docker-app
    ports:
      - "3000:3000"        # host:container
    environment:
      - PORT=3000
      - NODE_ENV=production
    volumes:
      # Persist data.json changes made at runtime
      - ./data.json:/app/data.json
    restart: unless-stopped
